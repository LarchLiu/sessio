name: release

# Build Sessio installers and Tauri updater artifacts.
#
# Trigger: push a tag like `v0.1.0`. Manual dispatch can rebuild artifacts for
# an existing release without creating another tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to attach artifacts to (must already exist)'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Activate pnpm
        run: corepack prepare pnpm@11.1.0 --activate
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build universal app and DMG
        run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg --ci
      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p staged
          cp src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz staged/sessio-macos-universal.app.tar.gz
          cp src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig staged/sessio-macos-universal.app.tar.gz.sig
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg staged/sessio-macos-universal.dmg
          ls -la staged
      - uses: actions/upload-artifact@v7
        with:
          name: sessio-macos-universal
          path: staged/*
          if-no-files-found: error

  build-linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Activate pnpm
        run: corepack prepare pnpm@11.1.0 --activate
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            patchelf
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build AppImage
        run: pnpm tauri build --bundles appimage --ci
      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p staged
          cp src-tauri/target/release/bundle/appimage/*.AppImage staged/sessio-linux-x86_64.AppImage
          cp src-tauri/target/release/bundle/appimage/*.AppImage.sig staged/sessio-linux-x86_64.AppImage.sig
          ls -la staged
      - uses: actions/upload-artifact@v7
        with:
          name: sessio-linux-x86_64
          path: staged/*
          if-no-files-found: error

  build-linux-arm64:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Activate pnpm
        run: corepack prepare pnpm@11.1.0 --activate
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            patchelf
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build AppImage
        run: pnpm tauri build --bundles appimage --ci
      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p staged
          cp src-tauri/target/release/bundle/appimage/*.AppImage staged/sessio-linux-aarch64.AppImage
          cp src-tauri/target/release/bundle/appimage/*.AppImage.sig staged/sessio-linux-aarch64.AppImage.sig
          ls -la staged
      - uses: actions/upload-artifact@v7
        with:
          name: sessio-linux-aarch64
          path: staged/*
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Activate pnpm
        run: corepack prepare pnpm@11.1.0 --activate
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis --ci
      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staged | Out-Null
          Copy-Item src-tauri\target\release\bundle\nsis\*.exe staged\sessio-windows-x86_64-setup.exe
          Copy-Item src-tauri\target\release\bundle\nsis\*.exe.sig staged\sessio-windows-x86_64-setup.exe.sig
          Get-ChildItem staged
      - uses: actions/upload-artifact@v7
        with:
          name: sessio-windows-x86_64
          path: staged/*
          if-no-files-found: error

  release:
    needs:
      - build-macos
      - build-linux-x86_64
      - build-linux-arm64
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p staged
          find artifacts -type f -print -exec mv {} staged/ \;
          ls -la staged
      - name: Generate release changelog
        run: npx changelogithub --output RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate updater manifest
        run: node scripts/generate-updater-manifest.mjs --dir staged --tag "${{ inputs.tag || github.ref_name }}" --repo "${{ github.repository }}" --notes RELEASE_NOTES.md
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd staged
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          make_latest: ${{ contains(inputs.tag || github.ref_name, '-') && 'false' || 'true' }}
          files: staged/*
          fail_on_unmatched_files: true
