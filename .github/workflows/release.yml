name: release

# Build Sessio installers and Tauri updater artifacts.
#
# Trigger: push a tag like `v0.1.0`. Manual dispatch can rebuild artifacts for
# an existing release without creating another tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to attach artifacts to (must already exist)'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

# Build jobs only need read access; the release job elevates to write below.
permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Activate pnpm
        run: corepack prepare pnpm@11.1.0 --activate
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install macOS Rust targets
        run: |
          rustup target add "${{ matrix.target }}"
          rustup target list --installed
      - name: Verify macOS build tools
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun -find codesign
          command -v hdiutil
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build macOS app and DMG
        run: pnpm tauri build --target "${{ matrix.target }}" --bundles app,dmg --ci
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p staged
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle"
          cp "$bundle_dir/macos"/*.app.tar.gz "staged/sessio-macos-${{ matrix.arch }}.app.tar.gz"
          cp "$bundle_dir/macos"/*.app.tar.gz.sig "staged/sessio-macos-${{ matrix.arch }}.app.tar.gz.sig"
          cp "$bundle_dir/dmg"/*.dmg "staged/sessio-macos-${{ matrix.arch }}.dmg"
          ls -la staged
      - uses: actions/upload-artifact@v7
        with:
          name: sessio-macos-${{ matrix.arch }}
          path: staged/*
          if-no-files-found: error

  build-linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Activate pnpm
        run: corepack prepare pnpm@11.1.0 --activate
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Linux packages
        run: pnpm tauri build --bundles deb,rpm --ci
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p staged
          cp src-tauri/target/release/bundle/deb/*.deb staged/sessio-linux-x86_64.deb
          cp src-tauri/target/release/bundle/deb/*.deb.sig staged/sessio-linux-x86_64.deb.sig
          cp src-tauri/target/release/bundle/rpm/*.rpm staged/sessio-linux-x86_64.rpm
          cp src-tauri/target/release/bundle/rpm/*.rpm.sig staged/sessio-linux-x86_64.rpm.sig
          ls -la staged
      - uses: actions/upload-artifact@v7
        with:
          name: sessio-linux-x86_64
          path: staged/*
          if-no-files-found: error

  build-linux-arm64:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Activate pnpm
        run: corepack prepare pnpm@11.1.0 --activate
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Linux packages
        run: pnpm tauri build --bundles deb,rpm --ci
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p staged
          cp src-tauri/target/release/bundle/deb/*.deb staged/sessio-linux-aarch64.deb
          cp src-tauri/target/release/bundle/deb/*.deb.sig staged/sessio-linux-aarch64.deb.sig
          cp src-tauri/target/release/bundle/rpm/*.rpm staged/sessio-linux-aarch64.rpm
          cp src-tauri/target/release/bundle/rpm/*.rpm.sig staged/sessio-linux-aarch64.rpm.sig
          ls -la staged
      - uses: actions/upload-artifact@v7
        with:
          name: sessio-linux-aarch64
          path: staged/*
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Activate pnpm
        run: corepack prepare pnpm@11.1.0 --activate
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis --ci
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staged | Out-Null
          Copy-Item src-tauri\target\release\bundle\nsis\*.exe staged\sessio-windows-x86_64-setup.exe
          Copy-Item src-tauri\target\release\bundle\nsis\*.exe.sig staged\sessio-windows-x86_64-setup.exe.sig
          Get-ChildItem staged
      - uses: actions/upload-artifact@v7
        with:
          name: sessio-windows-x86_64
          path: staged/*
          if-no-files-found: error

  release:
    needs:
      - build-macos
      - build-linux-x86_64
      - build-linux-arm64
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p staged
          find artifacts -type f -print -exec mv {} staged/ \;
          ls -la staged
      - name: Resolve changelog base
        id: changelog_base
        run: |
          set -euo pipefail
          previous_tag="$(node scripts/find-previous-release-tag.mjs --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG")"
          if [ -n "$previous_tag" ]; then
            echo "Resolved previous published release tag: $previous_tag"
            echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          else
            echo "Resolved previous published release tag: <none>"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      - name: Generate release changelog
        run: |
          set -euo pipefail
          if [ -n "$PREVIOUS_RELEASE_TAG" ]; then
            echo "changelog range: $PREVIOUS_RELEASE_TAG -> $RELEASE_TAG"
            npx --yes changelogithub@14.0.0 --from "$PREVIOUS_RELEASE_TAG" --to "$RELEASE_TAG" --output RELEASE_NOTES.md
          else
            echo "changelog range: <repo start> -> $RELEASE_TAG"
            npx --yes changelogithub@14.0.0 --to "$RELEASE_TAG" --output RELEASE_NOTES.md
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_RELEASE_TAG: ${{ steps.changelog_base.outputs.previous_tag }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      - name: Generate updater manifest
        run: node scripts/generate-updater-manifest.mjs --dir staged --tag "${{ inputs.tag || github.ref_name }}" --repo "${{ github.repository }}" --notes RELEASE_NOTES.md
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd staged
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          make_latest: ${{ contains(inputs.tag || github.ref_name, '-') && 'false' || 'true' }}
          files: staged/*
          fail_on_unmatched_files: true
