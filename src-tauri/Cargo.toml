[package]
name = "sessio"
version = "0.5.0-beta.13"
description = "Sessio - Agent sessions manager"
authors = ["alex"]
edition = "2021"
rust-version = "1.95"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
tauri = { version = "2.11.0", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
log = "0.4"
anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
croner = "2"
dirs = "5.0"
agent-client-protocol = { version = "0.14.0", features = ["unstable_session_fork"] }
futures = "0.3"
shell-words = "1.1"
walkdir = "2.5"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "6"
notify-debouncer-full = "0.3"
crossbeam-channel = "0.5"
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2"
base64 = "0.22"
aes = "0.8"
ecb = "0.1"
cipher = { version = "0.4", features = ["block-padding", "alloc"] }
md-5 = "0.10"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart"] }
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["io-util", "process"] }
tokio-util = { version = "0.7", features = ["compat"] }
libc = "0.2"
tauri-plugin-notification = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
