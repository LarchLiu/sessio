[package]
name = "sessio"
version = "0.5.2"
description = "Sessio - Agent sessions manager"
authors = ["alex"]
edition = "2021"
rust-version = "1.95"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
tauri = { version = "2.11.0", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "1.1.2"
ts-rs = "11"
log = "0.4"
anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
croner = "2"
dirs = "5.0"
agent-client-protocol = { version = "2.0.0", features = ["unstable_session_fork", "unstable_mcp_over_acp"] }
futures = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
shell-words = "1.1"
walkdir = "2.5"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "6"
notify-debouncer-full = "0.3"
crossbeam-channel = "0.5"
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2"
base64 = "0.22"
aes = "0.8"
ecb = "0.1"
cipher = { version = "0.4", features = ["block-padding", "alloc"] }
md-5 = "0.10"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart"] }
rmcp = { version = "=1.7.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
libc = "0.2"
tauri-plugin-notification = "2"
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
tiny_http = "0.12"
image = { version = "0.25", default-features = false, features = ["png"] }
foreign-types = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
core-foundation = "0.10"
core-graphics = { version = "0.25", features = ["highsierra", "elcapitan"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["block2", "NSEvent", "NSApplication", "NSBezierPath", "NSBitmapImageRep", "NSBox", "NSButton", "NSColor", "NSControl", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSFont", "NSGraphics", "NSImage", "NSImageRep", "NSImageView", "NSPanel", "NSPathControl", "NSResponder", "NSRunningApplication", "NSTextField", "NSView", "NSWindow", "NSWorkspace", "objc2-core-graphics"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = { version = "0.3", features = ["CGImage"] }
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSGeometry", "NSString", "NSURL"] }
objc2-web-kit = { version = "0.3", features = ["block2", "objc2-app-kit", "objc2-core-foundation", "WKSnapshotConfiguration", "WKWebView"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
cairo-rs = { version = "0.18", features = ["png"] }
gtk = "0.18"
url = "2.5"
webkit2gtk = { version = "2", features = ["v2_40"] }
x11rb = "0.13"
zbus = "5.15"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
